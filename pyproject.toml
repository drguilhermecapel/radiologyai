[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "medai"
version = "0.1.0"
description = "MedAI Radiologia — research-only radiology AI platform with an evidence-graded condition catalog"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Guilherme Capel Pasqua" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  # numerics / imaging
  "numpy>=2.0",
  "scipy>=1.13",
  "pandas>=2.2",
  "pyarrow>=17",
  "scikit-learn>=1.5",
  "scikit-image>=0.24",
  "pillow>=10.4",
  "SimpleITK>=2.4",
  "nibabel>=5.2",
  # DICOM
  "pydicom>=3.0",
  "pylibjpeg>=2.0",
  "pylibjpeg-openjpeg>=2.4",
  "pylibjpeg-rle>=2.0",
  "pyjpegls>=1.4",
  "highdicom>=0.25",
  "dicomweb-client>=0.60",
  # models
  "torch>=2.5",
  "torchvision>=0.20",
  "torchxrayvision>=1.5.7",
  "safetensors>=0.4.5",
  # platform
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0.2",
  "httpx>=0.27",
  "typer>=0.12",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "reportlab>=4.2",
  "prometheus-client>=0.21",
]

[project.optional-dependencies]
# Selects CPU-only PyTorch wheels (CI, Docker, laptops). Without this extra,
# PyPI's default wheel is used (CUDA-enabled on Linux).
cpu = ["torch>=2.5", "torchvision>=0.20"]
# CT / MR whole-body and pathology segmentation (TotalSegmentator, nnU-Net).
volumetric = ["TotalSegmentator>=2.10"]
# Vision-language and foundation encoders (BiomedCLIP, RAD-DINO, mammography, echo).
foundation = ["transformers>=4.46", "open-clip-torch>=2.29", "timm>=1.0.11"]
# MONAI Model Zoo bundles.
monai = ["monai>=1.4"]
# Training extras for the owner's GPU workstation.
train = ["timm>=1.0.11", "tensorboard>=2.18"]

[project.scripts]
medai = "medai.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "ruff>=0.7",
  "mypy>=1.13",
  "pypdf>=5.1",
  "types-PyYAML>=6.0",
  "pip-audit>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/medai"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "S", "N"]
ignore = [
  "E501",   # line length handled by the formatter
  "S101",   # asserts are fine in tests and for internal invariants
  "RUF001", # Portuguese text legitimately contains accented look-alikes
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802", "N806"]
"tools/**" = ["S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["medai"]

[tool.mypy]
python_version = "3.11"
packages = ["medai"]
mypy_path = "src"
strict = true
warn_return_any = false
disallow_untyped_calls = false
disallow_subclassing_any = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "torchxrayvision.*",
  "SimpleITK.*",
  "nibabel.*",
  "skimage.*",
  "sklearn.*",
  "scipy.*",
  "highdicom.*",
  "dicomweb_client.*",
  "reportlab.*",
  "totalsegmentator.*",
  "open_clip.*",
  "transformers.*",
  "timm.*",
  "monai.*",
  "torchvision.*",
  "safetensors.*",
  "pandas.*",
  "pyarrow.*",
  "prometheus_client.*",
  "yaml.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not weights and not network and not heavy'"
timeout = 300
markers = [
  "weights: needs real pretrained weights in the local cache (medai models pull)",
  "network: needs outbound network access",
  "heavy: long-running or memory-hungry (serialised through tools/heavy)",
  "orthanc: needs a running Orthanc DICOMweb server",
]
filterwarnings = [
  "error::DeprecationWarning:medai.*",
]

[tool.coverage.run]
source = ["medai"]
branch = true
