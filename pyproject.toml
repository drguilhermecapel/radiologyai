[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "radiologyai"
version = "2.0.0.dev0"
description = "Plataforma de pesquisa em interpretação de imagens radiológicas por IA. Software de pesquisa — não é dispositivo médico."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Guilherme Capel Pasqua" }]
keywords = ["radiology", "dicom", "medical-imaging", "samd"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# Núcleo deliberadamente leve: SEM torch. Isso mantém `import radiologyai`
# abaixo de 200 ms e permite CI de CPU rápido. Ver ROADMAP §8.
#
# pydicom 3 e numpy 2 (2026-11): highdicom e dicomweb-client exigem pydicom>=3;
# MONAI 1.6 exige torch>=2.8. O código de src/ foi conferido contra a API do
# pydicom 3 (dcmwrite com enforce_file_format, pixel_array via pixels backend).
dependencies = [
  "numpy>=2.0,<3",
  "pydicom>=3.0.1,<4",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
# Leitura de imagem: séries/volumes (SimpleITK), NIfTI (nibabel), raster
# (Pillow) e decodificadores de sintaxes de transferência comprimidas. Todos
# MIT/BSD/Apache. pylibjpeg-libjpeg (GPL-3) fica DE FORA de propósito; JPEG
# lossless é coberto pelo python-gdcm (BSD).
imaging = [
  "SimpleITK>=2.3,<3",
  "Pillow>=10.0",
  "nibabel>=5.2,<6",
  "pylibjpeg>=2.0,<3",
  "pylibjpeg-openjpeg>=2.4,<3",
  "pylibjpeg-rle>=2.0,<3",
  "pyjpegls>=1.4,<2",
  "python-gdcm>=3.0.24,<4",
]
eval = [
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "pandas>=2.2,<4",
  "pyarrow>=17",
]
# Runtime de modelos. Sem o extra `cpu`, o torch vem do PyPI (com CUDA no
# Linux) — o caminho da estação com GPU do responsável. CI/Docker/notebooks
# usam `cpu`, que seleciona as rodas CPU do índice oficial do PyTorch.
ml = [
  "torch>=2.8,<3",
  "torchvision>=0.23",
  "timm>=1.0",
  "torchxrayvision>=1.5.7",
  "monai>=1.4,<2",
  "onnxruntime>=1.18",
]
cpu = [
  "torch>=2.8,<3",
  "torchvision>=0.23",
]
# Segmentação de corpo inteiro e patologias em TC/RM (TotalSegmentator/nnU-Net).
# Código Apache-2.0; parte das tarefas tem pesos não comerciais — sinalizado
# nos manifestos (commercial_use: "no").
volumetric = [
  "TotalSegmentator>=2.10,<3",
  "nibabel>=5.2,<6",
]
# Codificadores de fundação e modelos visão-linguagem (BiomedCLIP, RAD-DINO,
# MedSAM, mamografia, eco).
foundation = [
  "timm>=1.0.11",
  "safetensors>=0.4.5",
  "transformers>=4.46",
  "open-clip-torch>=2.29",
  "huggingface-hub>=0.26",
]
# Mamografia: o pré-processamento publicado dos modelos de mamografia usa
# OpenCV; reproduzi-lo bit a bit exige a mesma biblioteca (Apache-2.0).
mammography = [
  "opencv-python-headless>=4.10,<5",
]
api = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
]
# Plataforma: persistência, autenticação, laudo PDF, DICOM SR/SEG, DICOMweb,
# métricas operacionais.
platform = [
  "sqlalchemy>=2.0.36,<3",
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1",
  "reportlab>=4.1,<6",
  "highdicom>=0.25,<1",
  "python-multipart>=0.0.9",
  "httpx>=0.27,<1",
  "prometheus-client>=0.21,<1",
  "dicomweb-client>=0.60,<1",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  # scripts/check_citi_report.py lê PDF; reportlab gera os PDFs sintéticos dos
  # testes. Declarados aqui porque um teste que pula em silêncio por dependência
  # ausente não é um teste — é a ausência de um.
  "pypdf>=4.2,<8",
  "reportlab>=4.1,<6",
  # fastapi.testclient exige httpx; sem ele os 22 testes de integração da API
  # dão erro no job de qualidade (que não instala o extra [ml]).
  "httpx>=0.27,<1",
  "pip-audit>=2.7",
]

[project.scripts]
radiologyai = "radiologyai.cli.main:app"

# Ponto de extensão por modalidade (ROADMAP §4.1).
# Uma modalidade pode futuramente ser distribuída como pacote separado.
[project.entry-points."radiologyai.modalities"]
xr = "radiologyai.modalities.xr:XRPlugin"
ct = "radiologyai.modalities.ct:CTPlugin"
mr = "radiologyai.modalities.mr:MRPlugin"
us = "radiologyai.modalities.us:USPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/radiologyai"]

# O extra `cpu` troca a origem do torch/torchvision para as rodas CPU oficiais.
# Sem ele vale o PyPI (rodas CUDA no Linux). Aqui (sem GPU):
#   UV_PYTHON=3.11 uv sync --all-extras
# Na estação com GPU do responsável:
#   uv sync --extra ml --extra imaging --extra eval --extra volumetric ... (sem `cpu`)
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ---------------------------------------------------------------- ferramentas

[tool.pytest.ini_options]
testpaths = ["tests"]
# norecursedirs casa pelo NOME BASE, em qualquer profundidade. "data" aqui
# silenciava tests/unit/data/ inteiro — 66 testes que pareciam existir e nunca
# rodavam. Como testpaths já limita a varredura a tests/, os diretórios da raiz
# (legacy/, artifacts/, data/) nunca são visitados na execução padrão; as
# entradas abaixo só valem para quem rodar `pytest .` na raiz, e nenhuma delas
# pode ser o nome de um subdiretório de tests/. Ver test_collection.py.
norecursedirs = ["legacy", ".git", "artifacts"]
addopts = "-ra --strict-markers"
markers = [
  "requirement(id): vincula este teste a um requisito REQ-xxx (IEC 62304 §5.7)",
  "slow: teste lento; excluído do CI rápido",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM", "ARG", "PTH"]
ignore = ["A005"]  # subpacote `io` sombreia o stdlib de propósito (nome de domínio)

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["^legacy/", "^tests/"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
  "SimpleITK.*",
  "pydicom.*",
  "sklearn.*",
  "scipy.*",
  "torch",
  "torch.*",
  "torchxrayvision.*",
  "torchvision.*",
  "timm.*",
  "monai.*",
  "nibabel.*",
  "highdicom.*",
  "dicomweb_client.*",
  "reportlab.*",
  "totalsegmentator.*",
  "nnunetv2.*",
  "open_clip.*",
  "transformers.*",
  "safetensors.*",
  "huggingface_hub.*",
  "cv2.*",
  "pandas.*",
  "pyarrow.*",
  "skimage.*",
  "onnxruntime.*",
  "gdcm.*",
  "pylibjpeg.*",
  "PIL.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/radiologyai"]
omit = ["*/cli/*"]
