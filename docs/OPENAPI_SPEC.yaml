            X-Frame-Channels (1 ou 3), X-Frame-Dtype (uint16|int16|uint8), X-Frame-Scale (fator inteiro
            de redução: coordenada no quadro = coordenada de origem / escala), X-Frame-Index, X-Frame-Count,
            X-Rescale-Slope, X-Rescale-Intercept (valor físico = armazenado * slope + intercept; HU em
            TC). O cliente aplica janela/LUT.'
