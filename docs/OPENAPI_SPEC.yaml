components:
  schemas:
    AbstentionReason:
      description: Por que o sistema recusou produzir um número. Sempre explícito.
      enum:
      - not_applicable_modality
      - not_applicable_exam_type
      - not_applicable_view
      - not_applicable_body_part
      - low_image_quality
      - out_of_distribution
      - low_confidence_band
      - missing_geometry
      - acquisition_precondition_not_met
      - unsupported_input
      - required_input_missing
      - unvalidated_population
      - upstream_model_unavailable
      title: AbstentionReason
      type: string
    AnalysisCreateIn:
      additionalProperties: false
      properties:
        include_research:
          default: false
          description: Roda também modelos exploratórios (exige papel com modo pesquisa).
          title: Include Research
          type: boolean
        model_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: Modelos explícitos (ignora o roteamento); dependências entram.
          title: Model Ids
        prompts:
          default: []
          description: Prompts do usuário para modelos interativos (caixa/ponto).
          items:
            $ref: '#/components/schemas/Primitive'
          title: Prompts
          type: array
      title: AnalysisCreateIn
      type: object
    AnalysisInput:
      additionalProperties: false
      properties:
        content_sha256:
          title: Content Sha256
          type: string
        image_idx:
          title: Image Idx
          type: integer
        series_id:
          title: Series Id
          type: string
      required:
      - image_idx
      - series_id
      - content_sha256
      title: AnalysisInput
      type: object
    AnalysisOut:
      additionalProperties: false
      properties:
        code_version:
          title: Code Version
          type: string
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        exam_type:
          $ref: '#/components/schemas/ExamType'
        finding_indices:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          description: Para cada achado exibido em result.findings, o índice no resultado completo (use-o
            em ReviewIn.finding_idx).
          title: Finding Indices
        finished_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Finished At
        hidden_research_artifacts:
          default: 0
          description: Segmentações e medidas exploratórias omitidas (sem achado A-C ligado).
          title: Hidden Research Artifacts
          type: integer
        hidden_research_findings:
          title: Hidden Research Findings
          type: integer
        id:
          title: Id
          type: string
        include_research:
          title: Include Research
          type: boolean
        inputs:
          items:
            $ref: '#/components/schemas/AnalysisInput'
          title: Inputs
          type: array
        model_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Model Ids
        requested_at:
          format: date-time
          title: Requested At
          type: string
        requested_by:
          title: Requested By
          type: string
        research_measurement_names:
          default: []
          description: Nomes das medidas exploratórias exibidas na visão de pesquisa.
          items:
            type: string
          title: Research Measurement Names
          type: array
        research_segmentation_indices:
          default: []
          description: Índices (no resultado completo) das segmentações exploratórias; só aparecem na
            visão de pesquisa e exigem marca d'água.
          items:
            type: integer
          title: Research Segmentation Indices
          type: array
        research_view:
          description: True quando achados de nível D estão incluídos.
          title: Research View
          type: boolean
        result:
          anyOf:
          - $ref: '#/components/schemas/AnalysisResult'
          - type: 'null'
        result_sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Result Sha256
        result_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Result Status
        reviews:
          items:
            $ref: '#/components/schemas/ReviewOut'
          title: Reviews
          type: array
        segmentation_indices:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          description: Para cada segmentação exibida em result.segmentations, o índice no resultado completo
            (use-o em /analyses/{id}/segmentations/{seg_index}/frames/{index}).
          title: Segmentation Indices
        shadow:
          default: false
          description: 'True quando o modo silencioso omitiu a saída de IA (REQ-195): result, result_sha256,
            result_status, índices e revisões vêm vazios; NÃO significa exame normal.'
          title: Shadow
          type: boolean
        started_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Started At
        state:
          enum:
          - queued
          - running
          - completed
          - failed
          title: State
          type: string
        study_id:
          title: Study Id
          type: string
      required:
      - id
      - study_id
      - state
      - exam_type
      - include_research
      - model_ids
      - requested_by
      - requested_at
      - started_at
      - finished_at
      - error
      - code_version
      - inputs
      - result_sha256
      - result_status
      - research_view
      - hidden_research_findings
      - finding_indices
      - result
      - reviews
      title: AnalysisOut
      type: object
    AnalysisResult:
      additionalProperties: false
      description: Resultado imutável de uma análise. Persistido em JSON; hasheado na assinatura.
      properties:
        analysis_id:
          format: uuid
          title: Analysis Id
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        disclaimer:
          const: Achado sugerido para confirmação médica. Software de pesquisa; não é diagnóstico.
          default: Achado sugerido para confirmação médica. Software de pesquisa; não é diagnóstico.
          title: Disclaimer
          type: string
        exam_type:
          $ref: '#/components/schemas/ExamType'
        explanations:
          default: []
          items:
            $ref: '#/components/schemas/Explanation'
          title: Explanations
          type: array
        findings:
          default: []
          items:
            $ref: '#/components/schemas/Finding'
          title: Findings
          type: array
        input_sha256:
          items:
            type: string
          title: Input Sha256
          type: array
        intended_use:
          const: research_use_only
          default: research_use_only
          title: Intended Use
          type: string
        measurements:
          default: []
          items:
            $ref: '#/components/schemas/Measurement'
          title: Measurements
          type: array
        provenance:
          default: []
          items:
            $ref: '#/components/schemas/ModelProvenance'
          title: Provenance
          type: array
        research_mode:
          default: false
          title: Research Mode
          type: boolean
        runs:
          default: []
          items:
            $ref: '#/components/schemas/ModelRun'
          title: Runs
          type: array
        schema_version:
          const: '1'
          default: '1'
          title: Schema Version
          type: string
        segmentations:
          default: []
          items:
            $ref: '#/components/schemas/Segmentation'
          title: Segmentations
          type: array
        status:
          enum:
          - completed
          - partial
          - abstained
          - failed
          title: Status
          type: string
        warnings:
          default: []
          items:
            type: string
          title: Warnings
          type: array
      required:
      - analysis_id
      - created_at
      - exam_type
      - input_sha256
      - status
      title: AnalysisResult
      type: object
    AnalysisSummary:
      additionalProperties: false
      properties:
        finished_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Finished At
        id:
          title: Id
          type: string
        include_research:
          title: Include Research
          type: boolean
        n_main_findings:
          anyOf:
          - type: integer
          - type: 'null'
          description: None no modo silencioso para quem não vê a saída de IA (REQ-195).
          title: N Main Findings
        n_research_findings:
          anyOf:
          - type: integer
          - type: 'null'
          title: N Research Findings
        requested_at:
          format: date-time
          title: Requested At
          type: string
        result_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Result Status
        shadow:
          default: false
          description: True quando a saída de IA foi omitida pelo modo silencioso (REQ-195).
          title: Shadow
          type: boolean
        state:
          enum:
          - queued
          - running
          - completed
          - failed
          title: State
          type: string
      required:
      - id
      - state
      - result_status
      - requested_at
      - finished_at
      - include_research
      - n_main_findings
      - n_research_findings
      title: AnalysisSummary
      type: object
    ArtifactRef:
      additionalProperties: false
      description: Ponteiro para um arquivo do repositório endereçado por conteúdo.
      properties:
        media_type:
          title: Media Type
          type: string
        relpath:
          title: Relpath
          type: string
        sha256:
          title: Sha256
          type: string
        shape:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Shape
      required:
      - sha256
      - media_type
      - relpath
      title: ArtifactRef
      type: object
    AuditEventOut:
      additionalProperties: false
      properties:
        actor_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor Id
        actor_username:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor Username
        event:
          title: Event
          type: string
        payload:
          additionalProperties: true
          title: Payload
          type: object
        prev_hash:
          title: Prev Hash
          type: string
        record_hash:
          title: Record Hash
          type: string
        seq:
          title: Seq
          type: integer
        subject_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Subject Id
        subject_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Subject Type
        timestamp_utc:
          title: Timestamp Utc
          type: string
      required:
      - seq
      - timestamp_utc
      - event
      - actor_id
      - actor_username
      - subject_type
      - subject_id
      - payload
      - prev_hash
      - record_hash
      title: AuditEventOut
      type: object
    AuditListOut:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/AuditEventOut'
          title: Items
          type: array
        next_after_seq:
          anyOf:
          - type: integer
          - type: 'null'
          title: Next After Seq
      required:
      - items
      - next_after_seq
      title: AuditListOut
      type: object
    AuditVerifyOut:
      additionalProperties: false
      properties:
        anchored_seq:
          anyOf:
          - type: integer
          - type: 'null'
          description: Seq do último checkpoint externo conferido (fora do banco).
          title: Anchored Seq
        broken_at_seq:
          anyOf:
          - type: integer
          - type: 'null'
          title: Broken At Seq
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
        events:
          title: Events
          type: integer
        last_hash:
          title: Last Hash
          type: string
        ok:
          title: Ok
          type: boolean
      required:
      - ok
      - events
      - last_hash
      - broken_at_seq
      - detail
      title: AuditVerifyOut
      type: object
    Body_analyze_api_v1_analyze_post:
      properties:
        card_id:
          default: xrv-densenet121-pc
          title: Card Id
          type: string
        file:
          contentMediaType: application/octet-stream
          description: Arquivo DICOM
          title: File
          type: string
      required:
      - file
      title: Body_analyze_api_v1_analyze_post
      type: object
    Body_upload_study_api_v1_studies_post:
      properties:
        body_part:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          title: Body Part
        exam_type:
          anyOf:
          - $ref: '#/components/schemas/ExamType'
          - type: 'null'
          description: Tipo de exame declarado
        files:
          description: DICOM (ou zip de DICOM), NIfTI, PNG ou JPEG
          items:
            contentMediaType: application/octet-stream
            type: string
          title: Files
          type: array
        laterality:
          anyOf:
          - enum:
            - L
            - R
            - B
            type: string
          - type: 'null'
          title: Laterality
        modality:
          anyOf:
          - enum:
            - CR
            - DX
            - CT
            - MR
            - MG
            - US
            - OT
            type: string
          - type: 'null'
          description: Obrigatória para NIfTI; PNG/JPEG usam OT se ausente
          title: Modality
        patient_age_years:
          anyOf:
          - maximum: 130.0
            minimum: 0.0
            type: number
          - type: 'null'
          title: Patient Age Years
        patient_sex:
          anyOf:
          - enum:
            - F
            - M
            - O
            type: string
          - type: 'null'
          title: Patient Sex
        sequence_role:
          anyOf:
          - maxLength: 32
            type: string
          - type: 'null'
          title: Sequence Role
        view_position:
          anyOf:
          - maxLength: 32
            type: string
          - type: 'null'
          title: View Position
      required:
      - files
      title: Body_upload_study_api_v1_studies_post
      type: object
    CatalogConditionOut:
      additionalProperties: false
      properties:
        best_level:
          enum:
          - A
          - B
          - C
          - D
          title: Best Level
          type: string
        code:
          $ref: '#/components/schemas/CodedConcept'
        entries:
          items:
            $ref: '#/components/schemas/CatalogEntryOut'
          title: Entries
          type: array
        exam_types:
          items:
            $ref: '#/components/schemas/ExamType'
          title: Exam Types
          type: array
        group:
          title: Group
          type: string
        id:
          title: Id
          type: string
        name_en:
          title: Name En
          type: string
        name_pt:
          title: Name Pt
          type: string
        research_only:
          title: Research Only
          type: boolean
        system:
          title: System
          type: string
      required:
      - id
      - name_pt
      - name_en
      - group
      - exam_types
      - system
      - code
      - entries
      - best_level
      - research_only
      title: CatalogConditionOut
      type: object
    CatalogEntryOut:
      additionalProperties: false
      properties:
        basis:
          items:
            type: string
          title: Basis
          type: array
        headline:
          anyOf:
          - type: string
          - type: 'null'
          title: Headline
        label:
          title: Label
          type: string
        level:
          enum:
          - A
          - B
          - C
          - D
          title: Level
          type: string
        model_id:
          title: Model Id
          type: string
        restricted_by_manifest:
          default: false
          description: Nível medido A-C, mas o manifesto restringe o modelo ao modo pesquisa.
          title: Restricted By Manifest
          type: boolean
        visibility:
          enum:
          - main
          - research
          title: Visibility
          type: string
      required:
      - model_id
      - label
      - level
      - visibility
      - headline
      - basis
      title: CatalogEntryOut
      type: object
    CatalogOut:
      additionalProperties: false
      properties:
        conditions:
          items:
            $ref: '#/components/schemas/CatalogConditionOut'
          title: Conditions
          type: array
        level_meanings:
          additionalProperties:
            type: string
          title: Level Meanings
          type: object
        protocol_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Protocol Id
        uncatalogued:
          items:
            $ref: '#/components/schemas/UncataloguedLabelOut'
          title: Uncatalogued
          type: array
      required:
      - protocol_id
      - level_meanings
      - conditions
      - uncatalogued
      title: CatalogOut
      type: object
    CodedConcept:
      additionalProperties: false
      description: 'Termo codificado: esquema de codificação, valor e significado.'
      properties:
        meaning:
          title: Meaning
          type: string
        scheme:
          title: Scheme
          type: string
        value:
          title: Value
          type: string
      required:
      - scheme
      - value
      - meaning
      title: CodedConcept
      type: object
    DicomwebImportIn:
      additionalProperties: false
      properties:
        exam_type:
          anyOf:
          - $ref: '#/components/schemas/ExamType'
          - type: 'null'
        study_instance_uid:
          pattern: ^[0-9.]{1,64}$
          title: Study Instance Uid
          type: string
      required:
      - study_instance_uid
      title: DicomwebImportIn
      type: object
    DicomwebSearchOut:
      additionalProperties: false
      properties:
        items:
          items:
            additionalProperties: true
            type: object
          title: Items
          type: array
      required:
      - items
      title: DicomwebSearchOut
      type: object
    ErrorOut:
      additionalProperties: false
      properties:
        detail:
          anyOf:
          - type: string
          - additionalProperties: true
            type: object
          - items: {}
            type: array
          title: Detail
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      required:
      - detail
      title: ErrorOut
      type: object
    EvidenceLevel:
      description: Nível de evidência de um trio (condição, modelo, rótulo). Sempre calculado.
      enum:
      - A
      - B
      - C
      - D
      title: EvidenceLevel
      type: string
    ExamType:
      description: Tipo de exame ao qual uma condição se aplica (chave de roteamento).
      enum:
      - cxr
      - msk_xr
      - ct_head
      - ct_chest
      - ct_abdomen
      - ct_other
      - mr_brain
      - mr_body
      - mg
      - us_breast
      - us_abdomen
      - us_other
      - echo
      - unknown
      title: ExamType
      type: string
    ExamTypeIn:
      additionalProperties: false
      properties:
        exam_type:
          $ref: '#/components/schemas/ExamType'
      required:
      - exam_type
      title: ExamTypeIn
      type: object
    Explanation:
      additionalProperties: false
      description: Mapa de explicação calculado pelo modelo real sobre a entrada real.
      properties:
        id:
          title: Id
          type: string
        image_idx:
          default: 0
          title: Image Idx
          type: integer
        map:
          $ref: '#/components/schemas/ArtifactRef'
        method:
          enum:
          - cam
          - gradcam
          - attention
          - occlusion
          title: Method
          type: string
        placement:
          $ref: '#/components/schemas/Primitive'
        provenance_idx:
          title: Provenance Idx
          type: integer
        target_label:
          title: Target Label
          type: string
      required:
      - id
      - method
      - target_label
      - map
      - placement
      - provenance_idx
      title: Explanation
      type: object
    ExportOut:
      additionalProperties: false
      properties:
        destination:
          title: Destination
          type: string
        skipped:
          default: []
          description: SEGs do laudo que não puderam ser gerados, com o motivo.
          items:
            $ref: '#/components/schemas/ExportSkipOut'
          title: Skipped
          type: array
        stored_sop_instance_uids:
          description: Somente os objetos que o servidor CONFIRMOU (ReferencedSOPSequence).
          items:
            type: string
          title: Stored Sop Instance Uids
          type: array
      required:
      - stored_sop_instance_uids
      - destination
      title: ExportOut
      type: object
    ExportSkipOut:
      additionalProperties: false
      properties:
        reason:
          title: Reason
          type: string
        seg_index:
          title: Seg Index
          type: integer
      required:
      - seg_index
      - reason
      title: ExportSkipOut
      type: object
    Finding:
      additionalProperties: false
      description: Um achado sugerido para confirmação médica — nunca um diagnóstico.
      properties:
        abstention_reason:
          anyOf:
          - $ref: '#/components/schemas/AbstentionReason'
          - type: 'null'
        calibration_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Calibration Id
        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
        class_scores:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Class Scores
        code:
          $ref: '#/components/schemas/CodedConcept'
        condition_id:
          title: Condition Id
          type: string
        decision:
          enum:
          - positive
          - negative
          - indeterminate
          - category
          - score_only
          - abstained
          title: Decision
          type: string
        decision_note:
          anyOf:
          - type: string
          - type: 'null'
          title: Decision Note
        evidence_level:
          $ref: '#/components/schemas/EvidenceLevel'
        explanation_ids:
          default: []
          items:
            type: string
          title: Explanation Ids
          type: array
        image_idx:
          default: 0
          title: Image Idx
          type: integer
        kind:
          enum:
          - binary
          - categorical
          - derived
          title: Kind
          type: string
        label:
          title: Label
          type: string
        measurement_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Measurement Ref
        op_normalized:
          anyOf:
          - type: number
          - type: 'null'
          title: Op Normalized
        operating_points:
          default: []
          items:
            $ref: '#/components/schemas/OperatingPoint'
          title: Operating Points
          type: array
        probability:
          anyOf:
          - type: number
          - type: 'null'
          title: Probability
        provenance_idx:
          title: Provenance Idx
          type: integer
        raw_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Raw Score
        score_kind:
          enum:
          - logit
          - sigmoid
          - softmax
          - measurement
          - similarity
          title: Score Kind
          type: string
        visibility:
          enum:
          - main
          - research
          title: Visibility
          type: string
      required:
      - condition_id
      - label
      - code
      - kind
      - raw_score
      - score_kind
      - decision
      - evidence_level
      - visibility
      - provenance_idx
      title: Finding
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HealthOut:
      additionalProperties: false
      properties:
        disclaimer:
          title: Disclaimer
          type: string
        status:
          const: ok
          title: Status
          type: string
        subsystems:
          additionalProperties:
            type: boolean
          title: Subsystems
          type: object
        version:
          title: Version
          type: string
      required:
      - status
      - version
      - disclaimer
      - subsystems
      title: HealthOut
      type: object
    HealthzOut:
      additionalProperties: false
      properties:
        status:
          const: ok
          title: Status
          type: string
      required:
      - status
      title: HealthzOut
      type: object
    LabelOut:
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/CodedConcept'
        condition_id:
          title: Condition Id
          type: string
        evidence_level:
          enum:
          - A
          - B
          - C
          - D
          title: Evidence Level
          type: string
        in_catalog:
          title: In Catalog
          type: boolean
        key:
          title: Key
