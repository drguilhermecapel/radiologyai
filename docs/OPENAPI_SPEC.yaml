info:
  description: Software de pesquisa. NÃO é dispositivo médico. Nenhum modelo validado clinicamente. Toda
    saída é rascunho e requer revisão e validação médica. O sistema não afirma normalidade.
  title: RadiologyAI
  version: 2.0.0.dev0
openapi: 3.1.0
paths:
  /api/v1/analyses/{analysis_id}:
    get:
      description: 'Estado e, quando concluída, o resultado imutável (conferido contra ``result_sha256``).


        Por padrão achados exploratórios (nível D) são omitidos e contados em

        ``hidden_research_findings``.


        Modo silencioso (REQ-195) sem ``shadow:view``: estado, entradas e tempos são

        servidos; a saída de IA não (``shadow: true``, ``result: null``). Servir um

        resultado concluído assim é auditado (``shadow.redacted``).'
      operationId: get_analysis_api_v1_analyses__analysis_id__get
      parameters:
      - in: path
        name: analysis_id
        required: true
        schema:
          title: Analysis Id
          type: string
      - description: Inclui achados de nível D (exige papel com modo pesquisa)
        in: query
        name: include_research
        required: false
        schema:
          default: false
          description: Inclui achados de nível D (exige papel com modo pesquisa)
          title: Include Research
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisOut'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Conflict
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Content Too Large
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Service Unavailable
      summary: Get Analysis
      tags:
      - analyses
      x-permission: analyses:read
  /api/v1/analyses/{analysis_id}/reports:
    get:
      operationId: list_for_analysis_api_v1_analyses__analysis_id__reports_get
      parameters:
      - in: path
        name: analysis_id
        required: true
        schema:
          title: Analysis Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ReportOut'
                title: Response List For Analysis Api V1 Analyses  Analysis Id  Reports Get
                type: array
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Conflict
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Content Too Large
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
