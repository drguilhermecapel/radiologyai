    threshold: 0.3
    'on': measurement
    direction: ge
    source: 'Diretriz japonesa de HPN, 3a ed. (Nakajima et al., Neurol Med Chir 2021, doi:10.2176/nmc.st.2020-0292):
      ''Hydrocephalus is defined as EI >0.3.'' A mesma diretriz usa ''EI ≥0.3'' em outro trecho; aplicado
      >= no limiar exato. evidence-ct-mr id evans_index_03 (/root/medai-cache/research/evidence-ct-mr.verified.md)'
limitations:
- 'O próprio repositório declara: ''This is not a medical device and is not intended for clinical usage.'''
- 'pull direto não suportado: os pesos são membros de um zip de release; o registro só verifica os arquivos
  já extraídos (sha256 fixado dos bytes reais).'
- 'Tarefa marcada com ''*'' no README: ''not trained on the full totalsegmentator dataset but on some
  small other datasets. Therefore, expect them to work less robustly.'''
- Treinado em 38 sujeitos.
- 'Índice de Evans: ventriculomegalia, não ''hidrocefalia'' nem ''HPN''; exige idade >= 18 conhecida e
  crânio inteiro no plano axial; alinhamento AC-PC não verificado.'
