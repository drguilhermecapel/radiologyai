applicability:
  exam_types:
  - us_breast
  - us_abdomen
  - us_other
  - echo
  modalities:
  - US
  image_kinds:
  - projection
  - cine
  min_pixels: 64
inputs:
  mode: single
  prompts: required
training_data:
- medsam-training-corpus
- busi
- camus
limitations:
- Interativo — a qualidade depende da caixa; não detecta lesões sozinho.
- Sem espaçamento físico, área e diâmetros se abstêm (só a máscara é devolvida).
- Marcas de medida gravadas na imagem podem alterar o contorno.
- BUSI e CAMUS fizeram parte do desenvolvimento do MedSAM; medição neles não é externa.
references:
- title: Segment anything in medical images (MedSAM)
  identifier: doi:10.1038/s41467-024-44824-z
  url: https://doi.org/10.1038/s41467-024-44824-z
config:
  input_size: 1024
  normalization: min-max [0, 1], sem média/desvio do ImageNet (MedSAM_Inference.py)
