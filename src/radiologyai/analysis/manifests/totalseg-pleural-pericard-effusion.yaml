  url: https://doi.org/10.1148/ryai.230024
- title: Sexauer et al., pleural effusion, Invest Radiol 2022
  identifier: doi:10.1097/RLI.0000000000000869
  url: https://doi.org/10.1097/RLI.0000000000000869
- title: Wilder-Smith et al., pericardial effusion, Diagnostics 2022
  identifier: doi:10.3390/diagnostics12051045
  url: https://doi.org/10.3390/diagnostics12051045
