labels:
- key: pleural_effusion
  source_label: pleural_effusion
  condition_id: ct.pleural_effusion
  kind: derived
  score_kind: measurement
  code:
    scheme: 99MEDAI
    value: ct.pleural_effusion
    meaning: pleural effusion (segmented volume)
  measurement: pleural_effusion_volume_ml
- key: pericardial_effusion
  source_label: pericardial_effusion
  condition_id: ct.pericardial_effusion
  kind: derived
  score_kind: measurement
  code:
    scheme: 99MEDAI
    value: ct.pericardial_effusion
    meaning: pericardial effusion > 50 mL (segmented volume)
  measurement: pericardial_effusion_volume_ml
operating_points:
- label: pleural_effusion
  point:
    name: any_volume_ge_0_1ml
    role: balanced
    threshold: 0.1
    'on': measurement
    direction: ge
    source: 'regra de detecção PRÉ-ESPECIFICADA do projeto (manifesto, 2026-11-24; protocolo 2026-11-v1,
      ''detection endpoints judged at a fixed, pre-specified threshold''): positivo quando o volume segmentado
      total é >= 0,1 mL; limiar de engenharia para ignorar voxels isolados, NÃO ajustado a dados e SEM
      validação publicada'
- label: pericardial_effusion
  point:
    name: pericardial_effusion_gt_50ml
    role: guideline
    threshold: 50.0
    'on': measurement
    direction: ge
    source: 'Wilder-Smith et al., Diagnostics 2022, doi:10.3390/diagnostics12051045: ''A PEF is most commonly
      defined as a volume larger than 50 mL'' (convenção do artigo do modelo; >= no limiar exato). Conferido
      em /root/medai-cache/research/evidence-ct-mr.verified.md §6.5'
limitations:
- 'O próprio repositório declara: ''This is not a medical device and is not intended for clinical usage.'''
- 'pull direto não suportado: os pesos são membros de um zip de release; o registro só verifica os arquivos
  já extraídos (sha256 fixado dos bytes reais).'
- 'Tarefa marcada com ''*'' no README: ''not trained on the full totalsegmentator dataset but on some
  small other datasets. Therefore, expect them to work less robustly.'''
- Classificação simples x complexo NÃO é exposta (fraca na fonte).
- Modelo desenvolvido em kernel de partes moles e cortes finos; Dice externo cai (0,89 interno para 0,71
  no PleThora, evidence-ct-mr §1.3).
references:
- title: 'TotalSegmentator: Robust Segmentation of 104 Anatomic Structures in CT Images'
