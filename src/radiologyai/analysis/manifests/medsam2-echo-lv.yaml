id: medsam2-echo-lv
version: medsam2-us-heart-e4a6f35
name: MedSAM2 US Heart — traçado assistido do VE + Simpson (VDF, VSF, FE)
status: available
adapter: radiologyai.analysis.adapters.echo_medsam2:MedSAM2EchoLVAdapter
task: measurement
capabilities:
- segment
- measure
- prompt
summary: Traçado ASSISTIDO da cavidade do VE em clipes apicais (A4C obrigatório, A2C opcional) a partir
  de caixas do usuário em ED e ES; volumes e FE pelo método dos discos (biplanar ou monoplanar). Medida
  geométrica dos contornos exibidos, só no modo pesquisa. Achado sugerido para confirmação médica.
visibility_default: research
route: interactive
source:
  repository: https://huggingface.co/wanglab/MedSAM2
  revision: e4a6f35edd7e091619cbc0750f462f1574e23955
  code: radiologyai.analysis.vendor.sam2 (sam2 1.1.0, Apache-2.0, vendorizado sem hydra)
  config: sam2.1_hiera_t512.yaml de bowang-lab/MedSAM2 (transcrito em vendor/sam2/build.py)
  simpson: radiologyai.analysis.adapters.echo_simpson (implementação própria do método dos discos)
  evaluation_script: scripts/predict_echo_camus.py
weights:
- key: checkpoint
  url: https://huggingface.co/wanglab/MedSAM2/resolve/e4a6f35edd7e091619cbc0750f462f1574e23955/MedSAM2_US_Heart.pt
  filename: MedSAM2_US_Heart.pt
  extract: none
  unsafe_pickle: false
  note: dict com a chave model; torch.load(weights_only=True) e load_state_dict(strict=True)
  sha256: 295c0ff8912c99947c364287bbecd1cd36963f0c0ac67a042d292f0dedf8d933
  bytes: 156041079
license:
  code: Apache-2.0 (bowang-lab/MedSAM2; sam2 1.1.0)
  weights: 'contraditória: metadados do cartão no Hugging Face dizem cc-by-sa-4.0, mas o texto do cartão
