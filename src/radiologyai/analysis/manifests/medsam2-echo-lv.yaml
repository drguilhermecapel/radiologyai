applicability:
  exam_types:
  - echo
  modalities:
  - US
  image_kinds:
  - cine
  views:
  - A4C
  - A2C
  min_pixels: 128
  adult_only: true
inputs:
  mode: multi
  roles:
  - a4c
  optional_roles:
  - a2c
  prompts: required
training_data:
- medsam2-training-corpus
limitations:
- Assistido, não automático. Exige corte (A4C/A2C), quadros ED e ES e uma caixa do VE em cada um, informados
  pelo usuário; a variante sem prompt (atlas) existe só na avaliação.
- Segmentação quadro a quadro no modo imagem; a propagação temporal do SAM 2 não é usada (subestimou a
  FE na avaliação preliminar por superestimar a cavidade em ES).
- Sem espaçamento físico (DICOM SequenceOfUltrasoundRegions ou NIfTI) volumes e FE se abstêm.
- Nenhum limiar de FE com origem verificada foi registrado; a FE não vira achado de disfunção.
- CAMUS pode ter sido usado no treino do MedSAM2 (não declarado); a medição no CAMUS pode ser otimista.
- Pesos com licença contraditória; só pesquisa e ensino.
references:
- title: 'MedSAM2: Segment Anything in 3D Medical Images and Videos'
  identifier: arXiv:2504.03600
  url: https://arxiv.org/abs/2504.03600
- title: Deep Learning for Segmentation Using an Open Large-Scale Dataset in 2D Echocardiography (CAMUS)
  identifier: doi:10.1109/TMI.2019.2900516
config:
  n_discs: 20
  prompt_convention: Primitive bbox com frame = índice do quadro e label <corte>:<instante> (a4c:ed, a4c:es,
    a2c:ed, a2c:es)
