    name: any_volume_ge_0_1ml
    role: balanced
    threshold: 0.1
    'on': measurement
    direction: ge
    source: 'regra de detecção PRÉ-ESPECIFICADA do projeto (manifesto, 2026-11-24; protocolo 2026-11-v1,
      ''detection endpoints judged at a fixed, pre-specified threshold''): positivo quando o volume segmentado
      total é >= 0,1 mL; limiar de engenharia para ignorar voxels isolados, NÃO ajustado a dados e SEM
      validação publicada'
limitations:
- 'O próprio repositório declara: ''This is not a medical device and is not intended for clinical usage.'''
- 'pull direto não suportado: os pesos são membros de um zip de release; o registro só verifica os arquivos
  já extraídos (sha256 fixado dos bytes reais).'
- 'Tarefa marcada com ''*'' no README: ''not trained on the full totalsegmentator dataset but on some
  small other datasets. Therefore, expect them to work less robustly.'''
- 'Não é ferramenta de exclusão: na fonte, uma em cada quatro lesões de TC foi perdida internamente e
  uma em cada três externamente (evidence-ct-mr §1.3).'
- Não caracteriza a lesão (benigna x maligna).
