limitations:
- 'Treino só no BUSI (Egito, um centro); sem id de paciente: quase-duplicatas agrupadas por dHash, vazamento
  intrapaciente ainda possível na CV interna.'
- BUSI contém marcas de medida gravadas na imagem; a região recortada pode incluí-las.
- Região de treino = caixa da máscara de referência + 25%; na prática a caixa é do usuário.
- Pontos de operação das predições fora-da-dobra do treino; não calibrados para outra prevalência. Não
  substitui BI-RADS nem biópsia.
