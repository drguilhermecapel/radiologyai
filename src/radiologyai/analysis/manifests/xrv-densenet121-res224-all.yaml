limitations:
- Os op_threshs da biblioteca foram escolhidos no hold-out dos próprios dados de treino; não são calibrados
  para população externa.
- Pré-processamento pela faixa representável (BitsStored); a janela VOI do DICOM não é aplicada. Imagens
  de 12-16 bits com conteúdo em faixa estreita podem ficar com contraste reduzido em relação aos PNG de
  treino.
- 'Recorte central quadrado: estruturas fora do quadrado central não são vistas.'
- Rótulos de treino extraídos de laudo (NLP), não releitura de imagem.
