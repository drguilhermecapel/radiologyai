limitations:
- Os limiares do cartão do modelo foram escolhidos no hold-out interno do RSNA (autorrelato, sem IC, sem
  n) e NÃO são usados como ponto de operação; a decisão é score_only até medição própria.
- CBIS-DDSM foi usado no pré-treino; medir nele não é validação externa.
- Treinado em rastreamento (RSNA); em população diagnóstica (ex. CMMD, só lesões biopsiadas) o escore
  mede discriminação benigno x maligno, não detecção em rastreamento.
- A ordem das classes de densidade vem da codificação do repositório de treino (A/B/C/D = 0/1/2/3); não
  há métrica publicada para a cabeça de densidade.
- Exige a VOI completa do DICOM (inclusive VOILUTFunction SIGMOID); DICOM carregado sem ela é recusado.
- Incidência única por mama é aceita, com aviso (desempenho reduzido segundo o cartão).
- Escore e densidade por mama vão em rótulos com sufixo _left/_right; o contrato de Score ainda não carrega
  image_idx por mama.
