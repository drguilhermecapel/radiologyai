# Plano de medição da fábrica de evidência (protocolo 2026-11-v1).
#
# Escrito ANTES de rodar scripts/evidence_run.py --plan. Cada item declara o arquivo de
# predições já inferidas, os dados de treino do modelo (que decidem o vazamento pela
# tabela radiologyai.evidence.leakage), o padrão de referência e os pesos, cujo hash é
# lido do arquivo e conferido contra o manifesto do modelo.
#
# Codificadores congelados entram em training_data com o seu corpus de pré-treino:
#   RAD-DINO (cartão microsoft/rad-dino, revisão 110cbc18): MIMIC-CXR, CheXpert,
#     NIH-CXR, PadChest e BRAX.
#   BiomedCLIP (cartão, revisão 9f341de2): PMC-15M (figuras do PubMed Central).
#
# selection_data: datasets em que o modelo, o codificador ou hiperparâmetros foram
# ESCOLHIDOS comparando desempenho. O RAD-DINO foi escolhido pela AUROC externa de
# sondas de comparação em tb-shenzhen, tb-montgomery (TB, nos dois sentidos) e
# fracatlas -> grazpedwri-dx-sample (fratura): evidence/selection/xr-encoder/. Avaliar
# uma sonda RAD-DINO num deles é vazamento "known" (estimativa otimista, nunca nível A).
#
# reference_derived_input: a entrada do modelo foi derivada do padrão de referência
# (caixa da máscara de referência, quadros ED/ES anotados). O registro não sustenta A.
#
# status: measure  -> mede e grava o registro (aprovado, reprovado ou não elegível)
#         pending  -> conjunto incompleto: NENHUMA métrica é calculada ("medição pendente")
#         excluded -> não é conjunto de avaliação de condição; motivo declarado
format: radiologyai.evidence/plan-v1
protocol_id: "2026-11-v1"
preds_root: /root/medai-cache/eval-preds
jobs:
  # ------------------------------------------------------------------ RX de tórax: TB
  - id: xr-probe-tb@tb-montgomery
    status: measure
    model_id: xr-probe-tb
    dataset_id: tb-montgomery
    label: tuberculosis
    condition_id: cxr.tuberculosis
    predictions: xr-probe-tb/tb-montgomery/tuberculosis.parquet
    score_scale: logit
    training_data: [tb-shenzhen, mimic-cxr, chexpert, nih-cxr14, padchest, brax]
    selection_data: [tb-shenzhen, tb-montgomery, fracatlas, grazpedwri-dx-sample]
    reference_standard: other
    population: >-
      NLM Montgomery County (Maryland, EUA), programa de controle de TB; conjunto inteiro
      (138 radiografias PA, uma por caso)
    weights:
      encoder: /root/medai-cache/weights/registry/xr-probe-tb/model.safetensors
      encoder_config: /root/medai-cache/weights/registry/xr-probe-tb/config.json
      probe: /root/medai-cache/weights/registry/xr-probe-tb/probe.safetensors
    manifest: xr-probe-tb
    caveats:
      - "Rótulo do dataset: normal x manifestação de TB (sufixo do arquivo); padrão de referência não conferido além do readme da NLM."
      - "Sem id de paciente no dataset: cada caso tratado como um paciente."
  - id: xr-probe-tb@tb-shenzhen
    status: measure
    model_id: xr-probe-tb
    dataset_id: tb-shenzhen
    label: tuberculosis
    condition_id: cxr.tuberculosis
    predictions: xr-probe-tb/tb-shenzhen/tuberculosis.parquet
    score_scale: logit
    training_data: [tb-shenzhen, mimic-cxr, chexpert, nih-cxr14, padchest, brax]
    selection_data: [tb-shenzhen, tb-montgomery, fracatlas, grazpedwri-dx-sample]
    internal_holdout: true
    reference_standard: other
    population: NLM Shenzhen No.3 People's Hospital (China); conjunto inteiro (662 casos)
    weights:
      encoder: /root/medai-cache/weights/registry/xr-probe-tb/model.safetensors
      encoder_config: /root/medai-cache/weights/registry/xr-probe-tb/config.json
      probe: /root/medai-cache/weights/registry/xr-probe-tb/probe.safetensors
    manifest: xr-probe-tb
    caveats:
      - "Predições fora-da-dobra (CV interna) da mesma receita; o hash é o da sonda final ajustada no conjunto inteiro."
      - "Sem id de paciente no dataset: cada caso tratado como um paciente."
  - id: xr-probe-tb.trained-montgomery@tb-shenzhen
    status: measure
    model_id: xr-probe-tb.trained-montgomery
    dataset_id: tb-shenzhen
    label: tuberculosis
    condition_id: cxr.tuberculosis
    predictions: xr-probe-tb.trained-montgomery/tb-shenzhen/tuberculosis.parquet
    score_scale: logit
    training_data: [tb-montgomery, mimic-cxr, chexpert, nih-cxr14, padchest, brax]
    selection_data: [tb-shenzhen, tb-montgomery, fracatlas, grazpedwri-dx-sample]
    reference_standard: other
    population: NLM Shenzhen No.3 People's Hospital (China); conjunto inteiro (662 casos)
    weights:
      encoder: /root/medai-cache/weights/registry/xr-probe-tb/model.safetensors
      probe_training_embeddings: /root/medai-cache/eval-preds/_embeddings/rad-dino/tb-montgomery.npz
    caveats:
      - "Sonda de comparação NÃO distribuída (direção inversa: treino Montgomery, teste Shenzhen); seus tensores não foram persistidos."
      - "Proveniência da sonda: embeddings RAD-DINO de treino (hash acima) + receita determinística radiologyai.analysis.probes.fit.fit_probe (semente do protocolo)."
      - "Sem id de paciente no dataset: cada caso tratado como um paciente."
