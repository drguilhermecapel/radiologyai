    caveats:
      - "CMMD só tem mamas biopsiadas: mede benigno x maligno entre lesões suspeitas, não rastreamento."
      - "Prevalência da amostra (~48% maligno) fixada pelo desenho; VPP/VPN não generalizam."
      - "Unidade = mama (CC + MLO); mama contralateral sem biópsia excluída."
      - "Recorte prévio por mammo-crop (sha256 57bd1f259c2b1588d96953195665bca3972e0954194d8eaeaf2bd12af47591d2, conferido no manifesto mammo-crop)."
